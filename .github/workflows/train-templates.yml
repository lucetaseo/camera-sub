name: 구도 학습 (Train composition templates)

# COCO 사람 관절 데이터 + Wikimedia Commons·Openverse 자유 라이선스 인물 사진으로
# 샷 종류별 인물 구도 템플릿을 학습하고,
# 결과(app/assets/templates.json, learner/reports/training_summary.md)를 같은 브랜치에 커밋한다.
on:
  workflow_dispatch:
    inputs:
      per_group:
        description: "검색 그룹당 최대 사진 수 (전신/반신/클로즈업)"
        default: "400"
  push:
    paths:
      - "learner/**"
      - ".github/workflows/train-templates.yml"

permissions:
  contents: write

concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: learner/requirements.txt

      - name: 시스템 라이브러리 (MediaPipe 용)
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgles2 libgl1

      - name: 학습 도구 설치 및 테스트
        working-directory: learner
        run: |
          pip install -r requirements.txt
          python -m pytest -q

      # 지난 실행에서 받은 사진을 이어서 쓴다 (실행할수록 사진이 쌓임, 요청 한도 절약)
      - name: 이전에 받은 사진 불러오기
        uses: actions/cache/restore@v4
        with:
          path: references
          key: references-${{ github.run_id }}
          restore-keys: references-

      # COCO 2017 사람 관절 주석 (사진 없이 숫자만, 약 250MB, 한 번 받으면 캐시)
      - name: COCO 관절 데이터 캐시
        id: coco-cache
        uses: actions/cache@v4
        with:
          path: coco
          key: coco-person-keypoints-2017

      - name: COCO 관절 데이터 내려받기
        if: steps.coco-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p coco
          curl -sSL --retry 3 -o coco/ann.zip http://images.cocodataset.org/annotations/annotations_trainval2017.zip
          unzip -j -o coco/ann.zip 'annotations/person_keypoints_*.json' -d coco
          rm coco/ann.zip
          ls -la coco

      - name: 학습용 인물 사진 내려받기 (Wikimedia Commons + Openverse)
        working-directory: learner
        env:
          # (선택) https://api.openverse.org/v1/#tag/auth 에서 앱을 등록하고 저장소 Secrets 에 넣으면 요청 한도가 늘어난다.
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
        run: python -m composition_learner.fetch --out ../references --per-group "${{ github.event.inputs.per_group || '400' }}"

      - name: 받은 사진 저장 (다음 실행용)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: references
          key: references-${{ github.run_id }}

      - name: 구도 학습
        working-directory: learner
        run: |
          python -m composition_learner.cli \
            --images ../references \
            --coco ../coco/person_keypoints_train2017.json ../coco/person_keypoints_val2017.json \
            --out ../app/assets/templates.json \
            --features-out features.jsonl \
            --summary-out reports/training_summary.md
          cat reports/training_summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 앱 테스트 (학습된 템플릿이 앱에서 읽히는지 확인)
        working-directory: app
        run: flutter test

      - name: 사진 출처와 특징 보관 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: training-data
          path: |
            references/*/credits.jsonl
            learner/features.jsonl
          retention-days: 30

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/assets/templates.json learner/reports/training_summary.md
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "구도 템플릿 학습 결과 갱신 (Openverse 사진)"
            git push
          fi
